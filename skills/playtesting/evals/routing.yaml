should_fire:
  - 'create a playtest questionnaire to capture genuine player confusion points'
  - 'structure an external blind playtest protocol to observe unfiltered gameplay'
  - 'define key game telemetry events: player deaths, completion times, and drop-offs'
  - 'analyze playtester feedback to separate symptoms from underlying design flaws'
  - 'identify difficulty spikes where over 40% of players quit during chapter 2'
  - 'run internal focus tests to evaluate whether our core combat feels punchy'
  - 'synthesize qualitative player feedback into prioritized design actionable fixes'
  - 'set up automated telemetry dashboards tracking level completion rates'
should_not_fire:
  - prompt: 'run automated regression tests on game engine code'
    expect: 'test-suite'
  - prompt: 'conduct customer discovery interviews for B2B software'
    expect: 'customer-research'
  - prompt: 'audit game performance and framerate drops'
    expect: 'game-performance'
